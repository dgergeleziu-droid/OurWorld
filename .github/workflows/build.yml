name: Build OurWorld IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project OurWorld.xcodeproj \
            -scheme OurWorld \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/OurWorld.app Payload/
          zip -r OurWorld.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OurWorld.ipa
          path: OurWorld.ipa
